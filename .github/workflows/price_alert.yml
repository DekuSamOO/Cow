name: Price Alert (1 BTC ROAD)

on:
  schedule:
    # 每小時整點執行（UTC），涵蓋台灣時間全天
    - cron: '0 * * * *'
  # 允許手動觸發測試；verify_config=true 時另推 DEFENSE_CONFIG_JSON 指紋到 LINE
  # （防守三處同步哨兵，2026-07-14 稽核 No.1——比對本地 defense_config_check.py 輸出）
  workflow_dispatch:
    inputs:
      verify_config:
        description: '推送 secret 側防守 config 指紋到 LINE（同步驗證）'
        required: false
        default: 'false'

# 2026-11-20（余力 D 紅隊 D2 No.3）：同一時間只跑一場（手動 dispatch 撞上整點排程時排隊，避免雙推）
concurrency:
  group: price-alert
  cancel-in-progress: false

jobs:
  check_price:
    runs-on: ubuntu-22.04
    permissions:
      actions: read      # gh run download 需讀其他 run 的 artifact
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 還原最新的警報狀態（跨 run 去重持久化）。
      # 踩坑（2026-06）：actions/download-artifact 只能拿「當前 run」自己的 artifact，
      # 拿不到前一個 run → 跨 run 去重從未生效。
      # 2026-11-20 改走 artifacts API（同 daily_line_notify.yml，余力 B 抓蟲 B5 No.3）：
      # ①`gh run list --status success --limit 1` 曾在 daily 側回傳 10 天前的 run、造成套保重推；
      # ②推送失敗的 run 現在會被判失敗（下方 Fail if any LINE push failed），若只認「成功 run」，
      #   那場已上傳的 state 會被跳過 → 狀態倒退、重複推播。改成不看 run 結果，依 created_at 取最新。
      - name: Restore alert state from latest artifact
        env:
          GH_TOKEN: ${{ github.token }}
        # 2026-11-20（同 daily，余力 D 紅隊 D2 No.2）：查清單失敗或下載失敗＝還原失敗，
        # 設 STATE_RESTORE_FAILED=1 → 下方 Upload 跳過（空 state 不可蓋掉好的 artifact）、最後判 job 失敗。
        # 本場防守仍以空 state（armed）照跑：寧可重推首響，也不漏推。
        run: |
          if ! META=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=alert-state&per_page=100" \
                 --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last
                       | "\(.id) \(.created_at)"'); then
            echo "查詢 artifact 清單失敗 → 視為還原失敗"
            echo "STATE_RESTORE_FAILED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          ART_ID="${META%% *}"
          ART_AT="${META#* }"
          if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
            if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > state.zip \
               && unzip -o -q state.zip && rm -f state.zip; then
              echo "restored state from artifact $ART_ID (created_at $ART_AT)"
            else
              rm -f state.zip
              echo "artifact $ART_ID 下載失敗 → 視為還原失敗（不是第一次跑）"
              echo "STATE_RESTORE_FAILED=1" >> "$GITHUB_ENV"
            fi
          else
            echo "查無未過期的 alert-state artifact，從空 state 開始"
          fi
        continue-on-error: true

      - name: Run Price Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # U5-①：防守專用 LINE 通道（可選 secret，未設時 fallback 上方日常憑證）
          DEFENSE_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.DEFENSE_LINE_CHANNEL_ACCESS_TOKEN }}
          DEFENSE_LINE_USER_ID: ${{ secrets.DEFENSE_LINE_USER_ID }}
          IS_STREAMLIT_CLOUD: "true"
          PYTHONPATH: ${{ github.workspace }}
          DEFENSE_CONFIG_JSON: ${{ secrets.DEFENSE_CONFIG_JSON }}
        run: |
          python scripts/price_alert.py

      # 防守三處同步哨兵：手動 dispatch 帶 verify_config=true 時，把 secret 側
      # config 指紋推 LINE（公開 repo 的 log 不落指紋——取值空間有限有窮舉風險）
      - name: Verify defense config fingerprint
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_config == 'true'
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IS_STREAMLIT_CLOUD: "true"
          PYTHONPATH: ${{ github.workspace }}
          DEFENSE_CONFIG_JSON: ${{ secrets.DEFENSE_CONFIG_JSON }}
        run: |
          python scripts/defense_config_check.py --push

      # 無論是否觸發警報，都上傳最新狀態（保留 90 天，見下方 retention-days）
      - name: Upload alert state
        # 還原失敗那場是空 state，不可上傳（否則成為最新 artifact，下一場以空狀態接續）
        # always()：腳本中途丟例外也上傳已存檔的狀態（D2 No.3）；還原失敗那場例外
        if: always() && env.STATE_RESTORE_FAILED != '1'
        uses: actions/upload-artifact@v5
        with:
          name: alert-state
          path: alert_state.json
          # 2026-08-25：原為 2 天。狀態靠「從最近一個成功 run 下載 artifact」鏈接，
          # 連續 2 天沒有成功 run，artifact 就過期 → d3_confirmed / hedge_batch_* 這種
          # 「只推一次」的旗標會被清空並重複推播。拉到 90 天讓這件事實務上不可能發生
          # （需連續 90 天排程全失敗，而那時早就發現沒收到推播了）。
          retention-days: 90
        continue-on-error: true

      # 2026-11-20：防守推播失敗時腳本不直接 exit 1（會跳過上面的 Upload），改寫標記檔、
      # 這一步在上傳**之後**才判失敗 → GitHub 寄失敗信、下面 Alert on failure 試推一次。
      # 失敗那則 state 未前進，下一小時重送。
      - name: Fail if any LINE push failed
        run: |
          rc=0
          if [ "$STATE_RESTORE_FAILED" = "1" ]; then
            echo "本場 state 還原失敗（已跳過上傳）"
            rc=1
          fi
          if [ -f line_send_failures.txt ]; then
            echo "本場防守推播失敗："
            cat line_send_failures.txt
            rc=1
          fi
          exit $rc

      # 任一步驟失敗時推 LINE 文字告警，避免排程靜默失敗無人知
      - name: Alert on failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions「${{ github.workflow }}」執行失敗\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
