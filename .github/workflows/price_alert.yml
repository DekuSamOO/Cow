name: Price Alert (1 BTC ROAD)

on:
  schedule:
    # 每小時整點執行（UTC），涵蓋台灣時間全天
    - cron: '0 * * * *'
  # 允許手動觸發測試
  workflow_dispatch:

jobs:
  check_price:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 下載上次執行留下的警報狀態（第一次執行時 artifact 不存在，continue-on-error 略過）
      - name: Download alert state
        uses: actions/download-artifact@v5
        with:
          name: alert-state
          path: .
        continue-on-error: true

      - name: Run Price Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          IS_STREAMLIT_CLOUD: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/price_alert.py

      # 無論是否觸發警報，都上傳最新狀態（保留 2 天）
      - name: Upload alert state
        uses: actions/upload-artifact@v5
        with:
          name: alert-state
          path: alert_state.json
          retention-days: 2
        continue-on-error: true
