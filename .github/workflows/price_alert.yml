name: Price Alert (1 BTC ROAD)

on:
  schedule:
    # 每小時整點執行（UTC），涵蓋台灣時間全天
    - cron: '0 * * * *'
  # 允許手動觸發測試
  workflow_dispatch:

jobs:
  check_price:
    runs-on: ubuntu-22.04
    permissions:
      actions: read      # gh run download 需讀其他 run 的 artifact
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 還原上一個成功 run 的警報狀態（跨 run 去重持久化）。
      # 踩坑（2026-06）：actions/download-artifact 只能拿「當前 run」自己的 artifact，
      # 拿不到前一個 run → 跨 run 去重從未生效。改用 gh 從最近一個成功 run 下載。
      - name: Restore alert state from latest prior run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREV=$(gh run list --workflow=price_alert.yml --status success \
                 --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
          if [ -n "$PREV" ]; then
            gh run download "$PREV" -n alert-state -D . \
              && echo "restored state from run $PREV" || echo "run $PREV 無 state artifact（可能已過期）"
          else
            echo "無前一個成功 run，從空 state 開始"
          fi
        continue-on-error: true

      - name: Run Price Alert
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # U5-①：防守專用 LINE 通道（可選 secret，未設時 fallback 上方日常憑證）
          DEFENSE_LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.DEFENSE_LINE_CHANNEL_ACCESS_TOKEN }}
          DEFENSE_LINE_USER_ID: ${{ secrets.DEFENSE_LINE_USER_ID }}
          IS_STREAMLIT_CLOUD: "true"
          PYTHONPATH: ${{ github.workspace }}
          DEFENSE_CONFIG_JSON: ${{ secrets.DEFENSE_CONFIG_JSON }}
        run: |
          python scripts/price_alert.py

      # 無論是否觸發警報，都上傳最新狀態（保留 2 天）
      - name: Upload alert state
        uses: actions/upload-artifact@v5
        with:
          name: alert-state
          path: alert_state.json
          retention-days: 2
        continue-on-error: true

      # 任一步驟失敗時推 LINE 文字告警，避免排程靜默失敗無人知
      - name: Alert on failure
        if: failure()
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: |
          curl -sS -X POST https://api.line.me/v2/bot/message/push \
            -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions「${{ github.workflow }}」執行失敗\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
