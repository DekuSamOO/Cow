name: Daily LINE Notifier

on:
  schedule:
    # GitHub Actions 使用 UTC 時間 (台灣時間 = UTC + 8小時)
    # 註：免費版 Actions 整點壅塞易發不出去，沿用原畸零分鐘 23/39/27；只把小時調早避免最後一則拖到深夜
    # 台灣時間早上 08:23 -> UTC 00:23
    - cron: '23 0 * * *'
    # 台灣時間下午 13:39 -> UTC 05:39
    - cron: '39 5 * * *'
    # 台灣時間傍晚 18:27 -> UTC 10:27
    - cron: '27 10 * * *'
  # 允許在 GitHub Actions 頁面上手動觸發測試
  workflow_dispatch: 

jobs:
  send_notification:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 確保與你專案使用的版本一致

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Notifier Script
      # 將 GitHub Secrets 注入為 Python 腳本所需的環境變數
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python scripts/daily_line_notify.py
