name: Daily LINE Notifier

on:
  schedule:
    # GitHub Actions 使用 UTC 時間 (台灣時間 = UTC + 8小時)
    # 註：免費版 Actions 整點壅塞易發不出去，沿用原畸零分鐘 23/39/27；只把小時調早避免最後一則拖到深夜
    # 台灣時間早上 08:23 -> UTC 00:23
    - cron: '23 0 * * *'
    # 台灣時間下午 13:39 -> UTC 05:39
    - cron: '39 5 * * *'
    # 台灣時間傍晚 18:27 -> UTC 10:27
    - cron: '27 10 * * *'
  # 允許在 GitHub Actions 頁面上手動觸發測試
  workflow_dispatch: 

jobs:
  send_notification:
    runs-on: ubuntu-22.04
    permissions:
      actions: read      # gh run download 需讀其他 run 的 artifact
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 確保與你專案使用的版本一致

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 還原上一個成功 run 的警報狀態（供逃頂「每日一次」/ 行動翻轉 / 週報去重跨 run 持久化）。
    # 踩坑（2026-06）：原用 actions/download-artifact 只能拿「當前 run」自己的 artifact，
    # 拿不到前一個 run → 跨 run 去重從未生效（週報曾因此重複、行動翻轉警報從不觸發）。
    # 改用 gh 從「最近一個成功 run」下載其 escape-alert-state artifact。
    - name: Restore alert state from latest prior run
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PREV=$(gh run list --workflow=daily_line_notify.yml --status success \
               --limit 1 --json databaseId -q '.[0].databaseId' || echo "")
        if [ -n "$PREV" ]; then
          gh run download "$PREV" -n escape-alert-state -D . \
            && echo "restored state from run $PREV" || echo "run $PREV 無 state artifact（可能已過期）"
        else
          echo "無前一個成功 run，從空 state 開始"
        fi
      continue-on-error: true

    - name: Run Daily Notifier Script
      # 將 GitHub Secrets 注入為 Python 腳本所需的環境變數
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
        # 觸發本 run 的 cron（供週報 cron-gate 判斷是否傍晚場次；手動 dispatch 時為空字串）
        CRON_SCHEDULE: ${{ github.event.schedule }}
        DEFENSE_CONFIG_JSON: ${{ secrets.DEFENSE_CONFIG_JSON }}
      run: |
        python scripts/daily_line_notify.py

    # 上傳最新逃頂警報狀態（保留 2 天）
    - name: Upload escape alert state
      uses: actions/upload-artifact@v5
      with:
        name: escape-alert-state
        path: escape_alert_state.json
        retention-days: 2
      continue-on-error: true

    # 任一步驟失敗時推 LINE 文字告警，避免排程靜默失敗無人知
    - name: Alert on failure
      if: failure()
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      run: |
        curl -sS -X POST https://api.line.me/v2/bot/message/push \
          -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions「${{ github.workflow }}」執行失敗\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
