name: Daily LINE Notifier

on:
  schedule:
    # GitHub Actions 使用 UTC 時間 (台灣時間 = UTC + 8小時)
    # 註：免費版 Actions 整點壅塞易發不出去，沿用原畸零分鐘 23/39/27；只把小時調早避免最後一則拖到深夜
    # 台灣時間早上 08:23 -> UTC 00:23
    - cron: '23 0 * * *'
    # 台灣時間下午 13:39 -> UTC 05:39
    - cron: '39 5 * * *'
    # 台灣時間傍晚 18:27 -> UTC 10:27
    - cron: '27 10 * * *'
  # 允許在 GitHub Actions 頁面上手動觸發測試
  workflow_dispatch: 

jobs:
  send_notification:
    runs-on: ubuntu-22.04
    permissions:
      actions: read      # gh run download 需讀其他 run 的 artifact
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 確保與你專案使用的版本一致

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 還原最新的警報狀態（供逃頂「每日一次」/ 行動翻轉 / 週報 / 套保批次去重跨 run 持久化）。
    # 踩坑（2026-06）：原用 actions/download-artifact 只能拿「當前 run」自己的 artifact，
    # 拿不到前一個 run → 跨 run 去重從未生效（週報曾因此重複、行動翻轉警報從不觸發）。
    #
    # 踩坑（2026-09-11，本次）：改用 `gh run list --status success --limit 1` 定位
    # 「最近一個成功 run」之後，**那支 API 會回傳過期結果**——2026-09-09 14:42 與
    # 2026-09-10 14:32 兩場都拿到 08-31 的 run 33361776478（當時真正最新的成功 run 是
    # 同日稍早那兩場），狀態被打回 10 天前 → `hedge_batch_1` 旗標消失 →
    # **套保第 1 批重複推播兩次**（09-09 22:44、09-10 22:34），使用者差點重複建倉。
    # 同一命令在本機與其他場次都回傳正確值，屬 workflow-runs API 的讀取一致性問題，
    # 不是本 repo 的邏輯錯 —— 所以改成**不再依賴 run 的排序**：
    # 直接查 artifacts API（`?name=` 過濾），自己用 created_at 取最新一個未過期的，
    # 並把它的 created_at 傳給 Python 當「狀態新鮮度」的第二道守門（見
    # scripts/daily_line_notify.py 的 _state_artifact_age_hours）。
    - name: Restore alert state from latest artifact
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        META=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=escape-alert-state&per_page=100" \
               --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last
                     | "\(.id) \(.created_at)"' || echo "")
        ART_ID="${META%% *}"
        ART_AT="${META#* }"
        if [ -n "$ART_ID" ] && [ "$ART_ID" != "null" ]; then
          if gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > state.zip \
             && unzip -o -q state.zip && rm -f state.zip; then
            echo "restored state from artifact $ART_ID (created_at $ART_AT)"
            echo "STATE_ARTIFACT_CREATED_AT=$ART_AT" >> "$GITHUB_ENV"
          else
            rm -f state.zip
            echo "artifact $ART_ID 下載失敗，從空 state 開始"
          fi
        else
          echo "查無未過期的 escape-alert-state artifact，從空 state 開始"
        fi
      continue-on-error: true

    - name: Run Daily Notifier Script
      # 將 GitHub Secrets 注入為 Python 腳本所需的環境變數
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
        # 觸發本 run 的 cron（供週報 cron-gate 判斷是否傍晚場次；手動 dispatch 時為空字串）
        CRON_SCHEDULE: ${{ github.event.schedule }}
        DEFENSE_CONFIG_JSON: ${{ secrets.DEFENSE_CONFIG_JSON }}
      run: |
        python scripts/daily_line_notify.py

    # 上傳最新逃頂警報狀態（保留 2 天）
    - name: Upload escape alert state
      uses: actions/upload-artifact@v5
      with:
        name: escape-alert-state
        path: escape_alert_state.json
        # 2026-08-25：原為 2 天。狀態靠「從最近一個成功 run 下載 artifact」鏈接，
        # 連續 2 天沒有成功 run，artifact 就過期 → d3_confirmed / hedge_batch_* 這種
        # 「只推一次」的旗標會被清空並重複推播。拉到 90 天讓這件事實務上不可能發生
        # （需連續 90 天排程全失敗，而那時早就發現沒收到推播了）。
        retention-days: 90
      continue-on-error: true

    # 任一步驟失敗時推 LINE 文字告警，避免排程靜默失敗無人知
    - name: Alert on failure
      if: failure()
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
      run: |
        curl -sS -X POST https://api.line.me/v2/bot/message/push \
          -H "Authorization: Bearer $LINE_CHANNEL_ACCESS_TOKEN" \
          -H "Content-Type: application/json" \
          -d "{\"to\":\"$LINE_USER_ID\",\"messages\":[{\"type\":\"text\",\"text\":\"⚠️ GitHub Actions「${{ github.workflow }}」執行失敗\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}]}"
