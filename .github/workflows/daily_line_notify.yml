name: Daily LINE Notifier

on:
  schedule:
    # GitHub Actions 使用 UTC 時間 (台灣時間 = UTC + 8小時)
    # 註：Actions 免費排程常延遲 5~60 分鐘（高負載更久），故刻意調早避免最後一則拖到深夜
    # 台灣時間早上 08:00 -> UTC 00:00
    - cron: '0 0 * * *'
    # 台灣時間中午 12:30 -> UTC 04:30
    - cron: '30 4 * * *'
    # 台灣時間傍晚 18:00 -> UTC 10:00
    - cron: '0 10 * * *'
  # 允許在 GitHub Actions 頁面上手動觸發測試
  workflow_dispatch: 

jobs:
  send_notification:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12' # 確保與你專案使用的版本一致

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Daily Notifier Script
      # 將 GitHub Secrets 注入為 Python 腳本所需的環境變數
      env:
        LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        PYTHONPATH: ${{ github.workspace }}
      run: |
        python scripts/daily_line_notify.py
